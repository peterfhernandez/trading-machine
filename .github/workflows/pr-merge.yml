name: Run on PR Merge

on:
  pull_request:
    types:
      - closed   # fires when PR is closed (merged or manually closed)
      
defaults:
  run:
    shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
    
jobs:
  run-on-merge:
    if: github.event.pull_request.merged == true   # ensures it's a merge
    runs-on: trading-machine   # your laptop runner
    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory C:\Users\Peter\coderepo\trading-machine

      - name: Pull latest
        run: |
          git -C C:\Users\Peter\coderepo\trading-machine fetch origin main
          git -C C:\Users\Peter\coderepo\trading-machine reset --hard origin/main
