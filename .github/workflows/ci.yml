name: CI

# Runs *before* a merge, which is the whole point: the previous workflow fired
# on `pull_request: [closed]`, by which time bad code is already on main and the
# only remedy is a revert. Make this check required in the branch protection
# rules for `main` and a red suite stops being mergeable.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python and the version the README recommends.
        # Both, because a suite that only runs on one of them cannot tell you
        # which of the two the code actually supports.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # A hard gate as of the commit that cleared the backlog to zero. Note
        # this is `ruff check` only — the formatter is not enforced, because
        # adopting it would reformat 62 of 87 files for no correctness gain.
        # `ruff format` stays available locally for anyone who wants it.
        run: ruff check .

      - name: Tests
        # No network: every ccxt call in the suite is mocked and every store is
        # a tmp_path, so this is the same run the laptop does before deploying.
        env:
          PAPER: "true"
          TM_LOG_DIR: ${{ runner.temp }}/tm-logs
        run: pytest

      - name: Type check
        # Advisory for now — mypy is not clean on this codebase yet, and a
        # failing job nobody can fix teaches people to ignore the red X.
        continue-on-error: true
        run: mypy datastore/ loaders/ audit/ universe/ backtest/ signals/

  no-attribution:
    name: no attribution in commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One rule, defined the same way here and in the three PreToolUse
          # hooks: strip the repository's own two paths, then match the bare
          # words. Naming a file you are changing is not attribution, and
          # without the carve-out a commit that documents a change to either
          # file cannot be written at all.
          #
          # --no-merges is load-bearing: this repo's branches are named
          # `claude/<topic>`, so every merge commit subject GitHub generates
          # contains the word. Those are not authored text and are not ours to
          # rewrite.
          if git log --no-merges --format=%B "$BASE_SHA..$HEAD_SHA" \
              | sed 's/CLAUDE\.md//g;s/\.claude\///g' \
              | grep -inE 'claude|anthropic|co-authored-by|generated with|claude-session|claude\.ai|claude\.com|anthropic\.com'; then
            echo "::error::Commit messages must not carry tool attribution (see the project instructions)"
            exit 1
          fi
          echo "Commit messages are clean."
