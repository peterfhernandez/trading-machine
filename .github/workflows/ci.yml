name: CI

# Runs *before* a merge, which is the whole point: the previous workflow fired
# on `pull_request: [closed]`, by which time bad code is already on main and the
# only remedy is a revert. Make this check required in the branch protection
# rules for `main` and a red suite stops being mergeable.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python and the version the README recommends.
        # Both, because a suite that only runs on one of them cannot tell you
        # which of the two the code actually supports.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # Advisory, for now, and deliberately so: `ruff check .` reports 168
        # pre-existing findings on this codebase (mostly `Optional[X]` for
        # `X | None`, `timezone.utc` for `datetime.UTC`, and import ordering).
        # A gate that is red on the day it lands teaches everyone to ignore the
        # red X, so it reports while the backlog is cleared — see TODO.md
        # Phase 5.6. Flip both of these to hard failures in the same change
        # that clears it.
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        # No network: every ccxt call in the suite is mocked and every store is
        # a tmp_path, so this is the same run the laptop does before deploying.
        env:
          PAPER: "true"
          TM_LOG_DIR: ${{ runner.temp }}/tm-logs
        run: pytest

      - name: Type check
        # Advisory for now — mypy is not clean on this codebase yet, and a
        # failing job nobody can fix teaches people to ignore the red X.
        continue-on-error: true
        run: mypy datastore/ loaders/ audit/ universe/ backtest/ signals/

  no-attribution:
    name: no attribution in commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The same pattern the local pre-push hook uses
          # (.claude/settings.json), for the same reason: it matches
          # attribution *trailers and links*, not the bare words. This repo's
          # branches are named `claude/<topic>`, so those words appear in every
          # merge commit subject legitimately — a bare-word match would fail
          # every pull request and be switched off within a day.
          # --no-merges for the same reason.
          if git log --no-merges --format=%B "$BASE_SHA..$HEAD_SHA" \
              | grep -inE '_Generated by \[Claude Code\]|Co-Authored-By: Claude|Claude-Session:|claude\.ai|claude\.com|anthropic\.com'; then
            echo "::error::Commit messages must not carry tool attribution (see CLAUDE.md)"
            exit 1
          fi
          echo "Commit messages are clean."
