name: CI

# Runs *before* a merge, which is the whole point: the previous workflow fired
# on `pull_request: [closed]`, by which time bad code is already on main and the
# only remedy is a revert. Make this check required in the branch protection
# rules for `main` and a red suite stops being mergeable.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python, the version the README recommends,
        # and the one actually installed on the machine that runs the pipeline.
        # More than one, because a suite that runs on a single version cannot
        # tell you which versions the code supports.
        #
        # 3.14 is here because it was the gap that mattered: the local runs and
        # the `deploy.yml` verification step both use the trading machine's own
        # interpreter, so the version gating deployment was the one version CI
        # never exercised. 3.13 is deliberately not in the matrix — nothing runs
        # on it, and `requires-python` is a floor, not a per-version promise.
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # A hard gate as of the commit that cleared the backlog to zero. Note
        # this is `ruff check` only — the formatter is not enforced, because
        # adopting it would reformat 62 of 87 files for no correctness gain.
        # `ruff format` stays available locally for anyone who wants it.
        run: ruff check .

      - name: Tests
        # No network: every ccxt call in the suite is mocked and every store is
        # a tmp_path, so this is the same run the laptop does before deploying.
        env:
          PAPER: "true"
          TM_LOG_DIR: ${{ runner.temp }}/tm-logs
        run: pytest

      - name: Type check
        # Advisory for now — mypy is not clean on this codebase yet, and a
        # failing job nobody can fix teaches people to ignore the red X.
        continue-on-error: true
        run: mypy datastore/ loaders/ audit/ universe/ backtest/ signals/

  test-windows:
    # The trading machine is a Windows box on 3.14, and until now nothing
    # tested that combination before a merge: `ci.yml` is Linux-only, so the
    # only Windows verification in the project happened in `deploy.yml`, which
    # runs *after* the merge. Three defects have now reached `main` green and
    # failed there — pytest's temp-directory cleanup exiting 1, cp1252 stdout,
    # and an open log handle blocking a temp-directory removal. Every one of
    # them is a POSIX/Windows filesystem or console difference that no amount
    # of Linux matrix breadth can see.
    #
    # A separate job rather than an `os` dimension on the matrix above, for one
    # practical reason: adding a dimension renames the existing checks
    # ("tests (python 3.11)" -> "tests (ubuntu-latest, python 3.11)"), and
    # those names are what branch protection has marked required on `main`. A
    # rename leaves the required checks waiting forever on names nothing
    # reports. This job adds a name instead of changing three.
    name: tests (windows, python 3.14)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the version the trading machine runs, not the full
          # matrix. The point of this job is the *platform*, and Windows
          # minutes bill at 2x; the language-version question is already
          # answered three ways above.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Deliberately no lint or mypy step: neither is platform-dependent, and
      # running them twice would double the wall clock for an identical answer.

      - name: Tests
        env:
          PAPER: "true"
          TM_LOG_DIR: ${{ runner.temp }}/tm-logs
        # The exit code is part of the assertion, not just the summary line:
        # a green Windows run that exits 1 is exactly the failure
        # `tests/test_tmpdir_cleanup.py` exists for, and `deploy.yml` keys
        # `git reset --hard` off the same code.
        run: pytest

  no-attribution:
    name: no attribution in commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One rule, defined the same way here and in the three PreToolUse
          # hooks: strip the repository's own two paths, then match the bare
          # words. Naming a file you are changing is not attribution, and
          # without the carve-out a commit that documents a change to either
          # file cannot be written at all.
          #
          # --no-merges is load-bearing: this repo's branches are named
          # `claude/<topic>`, so every merge commit subject GitHub generates
          # contains the word. Those are not authored text and are not ours to
          # rewrite.
          if git log --no-merges --format=%B "$BASE_SHA..$HEAD_SHA" \
              | sed 's/CLAUDE\.md//g;s/\.claude\///g' \
              | grep -inE 'claude|anthropic|co-authored-by|generated with|claude-session|claude\.ai|claude\.com|anthropic\.com'; then
            echo "::error::Commit messages must not carry tool attribution (see the project instructions)"
            exit 1
          fi
          echo "Commit messages are clean."
