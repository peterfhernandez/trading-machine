[pytest]
# 8.4: caplog must capture from the non-propagating `tm` logger tree.
# See the pytest pin in pyproject.toml for why this is a floor, not taste.
minversion = 8.4
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: unit tests
    integration: integration tests (may hit filesystem/APIs)
    slow: slow tests (backfill, backtest)
