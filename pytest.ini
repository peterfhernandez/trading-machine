[pytest]
# 9.1: caplog must capture from the non-propagating `tm` logger tree, and
# test_tmpdir_cleanup.py's negative control must still reproduce. Two separate
# reasons for one number — see the pytest pin in pyproject.toml.
minversion = 9.1
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: unit tests
    integration: integration tests (may hit filesystem/APIs)
    slow: slow tests (backfill, backtest)
