[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "datastore*",
    "loaders*",
    "audit*",
    "universe*",
    "backtest*",
    "signals*",
    "risk*",
    "portfolio*",
    "execution*",
    "attribution*",
    "pipeline*",
]
exclude = ["tests*", "scratch*"]

[project]
name = "trading-machine"
version = "0.1.0"
description = "Poor Man's Trading Machine: a single-person multifactor crypto trading system"
requires-python = ">=3.12"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "ccxt>=4.0.0",
    "deribit-api>=0.0.1",
    "pytest>=7.4.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.4.0",
]
optimizer = [
    "cvxpy>=1.4.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests (may hit filesystem/APIs)",
    "slow: slow tests (backfill, backtest)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    ".env",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "W503",  # line break before binary operator
]

[tool.ruff.lint.isort]
known-first-party = [
    "datastore",
    "loaders",
    "audit",
    "universe",
    "backtest",
    "signals",
    "risk",
    "portfolio",
    "execution",
    "attribution",
    "pipeline",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
