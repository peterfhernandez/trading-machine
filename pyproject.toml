[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "datastore*",
    "loaders*",
    "audit*",
    "universe*",
    "backtest*",
    "signals*",
    "risk*",
    "portfolio*",
    "execution*",
    "attribution*",
    "pipeline*",
]
exclude = ["tests*", "scratch*"]

[project]
name = "trading-machine"
version = "0.1.0"
description = "Poor Man's Trading Machine: a single-person multifactor crypto trading system"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "ccxt>=4.0.0",
    "deribit-api>=0.0.1",
    # 9.1.0 is a hard floor, not a preference, and it has TWO independent
    # causes — fixing either one alone does not let it move:
    #
    # 1. `configure_logging` sets propagate=False on the `tm` logger, so its
    #    records never reach the root logger where pytest installs the caplog
    #    handler. `_pytest/logging.py::catching_logs.__enter__` walks
    #    `loggerDict` and attaches the handler to already-existing
    #    non-propagating loggers too — added in 9.1.0, and in no release
    #    before it. Measured against tests/test_logging.py: 7.4.4 through
    #    9.0.3 (8.4.x and 9.0.x included) give 11 failed / 61 passed; 9.1.0
    #    and 9.1.1 give 72 passed.
    # 2. tests/test_tmpdir_cleanup.py's negative control only reproduces the
    #    crash it guards against on >= 9.1.0. Below that the seeded run exits
    #    0 and the control fails — nothing to do with logging.
    #
    # This said ">= 8.4" until 2026-08-02, on the belief that 8.4 introduced
    # (1). It did not: every version the old pin admitted fails. The floor was
    # never load-bearing, which is why a repo venv on 9.1.1 was green while the
    # system interpreter's 9.0.3 failed 11 tests on the same commit.
    #
    # Two tests fail *silently* below the floor rather than loudly — the
    # "assert no CRITICAL was logged" ones pass while capturing nothing — so
    # they carry positive controls, and TestCaplogCanary fails loudly if (1)
    # ever stops holding. The `min-pytest` job in ci.yml installs exactly this
    # version, so the floor is checked rather than asserted.
    "pytest>=9.1.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.4.0",
]
optimizer = [
    "cvxpy>=1.4.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",
]

# pytest configuration lives in pytest.ini, not here. Both files existed, and
# pytest.ini wins by precedence — so the block that used to sit here was dead,
# and pytest printed "WARNING: ignoring pytest config in pyproject.toml" on
# every run. One source of truth; edit pytest.ini.

[tool.ruff]
line-length = 100
# The *floor* of requires-python, not the newest interpreter we run on: ruff's
# target-version decides which syntax it may suggest, and suggesting 3.12-only
# syntax would break the 3.11 half of the CI matrix.
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    ".env",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
]
ignore = [
    # Line length is NOT enforced. It used to say "handled by formatter", which
    # stopped being true when CI dropped `ruff format --check` (the formatter
    # would have reformatted 62 of 87 files, which is churn, not correctness).
    # Enabling E501 today would surface 50 findings that ruff cannot fix — it
    # will not rewrap code — so this is a deliberate gap, not an oversight.
    # line-length = 100 above still guides `ruff format` when run by hand.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = [
    "datastore",
    "loaders",
    "audit",
    "universe",
    "backtest",
    "signals",
    "risk",
    "portfolio",
    "execution",
    "attribution",
    "pipeline",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
